services:

  app:
    build: .
    container_name: fileshare-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fileshare:${POSTGRES_PASSWORD}@db:5432/fileshare?sslmode=disable
      FILES_DIR: /data/files
      LISTEN_ADDR: ":8080"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:-}
      QUOTA_USER_BYTES: ${QUOTA_USER_BYTES:-21474836480}
      QUOTA_USER_FILES: ${QUOTA_USER_FILES:-1000}
      QUOTA_TOTAL_BYTES: ${QUOTA_TOTAL_BYTES:-0}
      DISK_MIN_FREE_BYTES: ${DISK_MIN_FREE_BYTES:-1073741824}
    volumes:
      - ./data/files:/data/files
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${APP_PORT:-8080}:8080"

  db:
    image: postgres:16.4-alpine
    container_name: fileshare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fileshare
      POSTGRES_USER: fileshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileshare -d fileshare"]
      interval: 5s
      timeout: 5s
      retries: 10
